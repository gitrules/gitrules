name: GitRules for Individuals Agent

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "*/2 * * * *" # every 2 minutes

jobs:
  sync_github:
    environment: gitrules:governance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout governance repo to gain access to assets in .github directory
      - name: "Checkout gitrules code"
        uses: actions/checkout@v4
      #
      # https://github.com/actions/setup-python?tab=readme-ov-file#caching-packages-dependencies
      - name: "Setup python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
      - run: pip install -r .github/python/requirements.txt
      #
      - name: "Install gitrules from release"
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: gitrules/gitrules # binary is added to the PATH as well
          tag: ${{ vars.GITRULES_RELEASE }}
          cache: enable
          platform: linux
          arch: x86_64
      - name: "Prepare script permissions"
        shell: bash
        run: chmod a+x .github/scripts/gitrules_cron.sh
      - name: "Perform cron tasks"
        shell: bash
        run: .github/scripts/gitrules_cron.sh
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_REPO: ${{ vars.PROJECT_REPO }}
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL }}
          PRIVATE_REPO_URL: ${{ vars.PRIVATE_REPO_URL }}
          SYNC_GITHUB_FREQ: ${{ vars.SYNC_GITHUB_FREQ }}
          SYNC_COMMUNITY_FREQ: ${{ vars.SYNC_COMMUNITY_FREQ }}
          SYNC_FETCH_PAR: ${{ vars.SYNC_FETCH_PAR }}
